name: calcxpro
description: "CalcX Pro - A premium calculator app with basic, scientific, and advanced calculators."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  provider: ^6.1.2
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  path_provider: ^2.1.3
  share_plus: ^12.0.1
  vibration: ^3.1.5
  intl: ^0.20.2
  http: ^1.2.1
  math_expressions: ^3.1.0
  device_info_plus: ^12.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  hive_generator: ^2.0.1
  build_runner: ^2.4.9

  # ✅ APP ICON GENERATOR
  flutter_launcher_icons: ^0.14.4

# ✅ ICON CONFIGURATION (TOP LEVEL)
flutter_icons:
  android: true
  windows:
    generate: true
  ios: true
  image_path: "assets\\images\\icon\\app_icon.png"
  adaptive_icon_background: "#0F172A"
  adaptive_icon_foreground: "assets\\images\\icon\\app_icon_fg.png"

flutter:
  uses-material-design: true

  assets:
    - assets/images/calculator_banner.webp
    - assets/images/icon/app_icon.png
    - assets/images/icon/app_icon_fg.png
