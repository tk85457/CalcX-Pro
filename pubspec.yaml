name: calcxpro
description: "CalcX Pro - A premium calculator app with basic, scientific, and advanced calculators."
publish_to: "none"

version: 1.0.5+6

environment:
  sdk: ">=3.4.0 <4.0.0"
  flutter: ">=3.22.0"

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  provider: ^6.1.5
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  path_provider: ^2.1.5
  share_plus: ^10.1.4
  intl: ^0.20.2
  http: ^1.2.2
  math_expressions: ^2.6.0
  device_info_plus: ^10.1.2
  flutter_native_splash: ^2.4.4

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  hive_generator: ^2.0.1
  build_runner: ^2.4.13
  flutter_launcher_icons: ^0.14.3

flutter_icons:
  android: true
  windows:
    generate: true
  ios: true
  image_path: "assets\\images\\icon\\app_icon.png"
  adaptive_icon_background: "#0F172A"
  adaptive_icon_foreground: "assets\\images\\icon\\app_icon_fg.png"

flutter_native_splash:
  color: "#0F172A"
  image: assets/images/icon/app_icon.png
  android_12:
    image: assets/images/icon/app_icon.png
    color: "#0F172A"
  fullscreen: false

flutter:
  uses-material-design: true

  assets:
    - assets/images/calculator_banner.webp
    - assets/images/icon/app_icon.png
    - assets/images/icon/app_icon_fg.png
